services:
  - type: web
    name: lstm-tesla-predictor
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MODEL_PATH
        value: lstm_tesla_model.onnx
      - key: SCALER_PATH
        value: scaler_params.json
      - key: TIME_STEP
        value: "31"
